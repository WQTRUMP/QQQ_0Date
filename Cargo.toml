[workspace]
members = [
    "crates/common",
    "services/market_gateway",
    "services/realtime_engine",
    "services/risk_engine",
    "services/execution_gateway",
    "services/greeks_engine",
    "services/market_status",
    "services/premarket_init",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1.0"
async-nats = "=0.38.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "=4.5.20", features = ["derive", "env"] }
futures-util = "0.3"
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
statrs = "0.17"
tokio = { version = "=1.40.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
